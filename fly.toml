# Fly.io. Same image, no sleeping, a few dollars a month.
app = "patte"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  # Rooms live in this process's memory, so a second machine would be a second,
  # separate set of tables answering the same codes. One, until there is
  # somewhere shared to keep them.
  min_machines_running = 1
  auto_stop_machines = false

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
